# Publishes the tutorials as a static, read-only site on GitHub Pages.
# Runs whenever a lesson, the site build or the shared styles change on main,
# and can be started by hand from the Actions tab ("Run workflow").
name: Publish tutorials to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "tutorials/**"
      - "scripts/build-pages.ts"
      - "scripts/pages/**"
      - "src/server/tutorial-files.ts"
      - "static/style.css"
      - "static/favicon.svg"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but never cancels one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-pages.ts _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
